cv:
  name: "Stanley Okwii"
  headline: "Data Engineer  |  SQL, Data Quality & Data Pipelines"
  location: "London, United Kingdom (UK Right to Work)"
  email: "stanlee.okwii@icloud.com"
  phone: "+44 7570 488 532"
  website: "https://stanleeokwii.info/"
  social_networks:
    - network: "LinkedIn"
      username: "stanley-okwii"
    - network: "GitHub"
      username: "Stanley-Okwii"
  sections:
    PROFILE:
      - "Data focused engineer with 7+ years building and supporting production data systems, and an MSc in Data Analytics (Merit, Birkbeck). I work where business needs meet data: turning requirements into data models and pipelines, using **SQL** to validate data and find where it goes wrong, and tracing data issues back to their root cause. I have worked with product, analytics and enterprise client teams across time zones, planned delivery from scope to release, and written the documentation that keeps data systems understandable. I am now moving closer to the business side of data, where I can combine that hands on technical depth with requirements, data quality and delivery."
    CORE SKILLS:
      - label: "Delivery & stakeholders"
        details: "Requirements scoping, data models and API contracts, phased milestone planning, risk management, root cause analysis of production issues, technical documentation"
      - label: "Data engineering & databases"
        details: "**SQL**, **PostgreSQL**, MySQL, MongoDB, Snowflake, DBT, PySpark; ETL pipeline design, data modelling, data validation, access controls"
      - label: "Programming & infrastructure"
        details: "**Python**, SQL, TypeScript; **AWS**, Docker, CloudFormation, CI/CD; monitoring with Sentry and New Relic"
      - label: "Statistics & machine learning"
        details: "Statistical analysis, regression, classification, model evaluation; Pandas, NumPy, scikit-learn, R"
      - label: "NLP & generative AI"
        details: "LLM integration, retrieval pipelines, vector search (pgvector), source traceability for generated answers"
    EXPERIENCE:
      - company: "Access to Energy"
        position: "Founding Engineer"
        date:
        start_date: "2026-01"
        end_date: "present"
        location: "London, UK"
        summary: "An AI research assistant that answers questions on energy access in Africa from a curated library of sector reports. Team of 4. I own the backend, the data pipeline and the infrastructure."
        highlights:
          - "Built the document ingestion pipeline that parses, chunks and indexes large PDF reports into **PostgreSQL**, with automatic retries and a dead letter queue so failed documents are caught and reprocessed rather than silently lost."
          - "Designed every answer to trace back to the exact passage in its source report, so any figure the assistant gives can be checked against the evidence behind it."
          - "Designed the data model that lets multiple client organisations share one deployment, using role based access controls in PostgreSQL to strictly partition each organisation's documents."
          - "Automated **AWS** infrastructure provisioning with CloudFormation, taking environment setup from days to minutes and making deployments secure and repeatable."
      - company: "Hoppers"
        position: "Full Stack Software Engineer (Contract, Part Time)"
        date:
        start_date: "2025-10"
        end_date: "present"
        location: "Remote"
        summary: "Event ticketing platform (hoppers.ug) taking online payments."
        highlights:
          - "Built the payment engine across two providers (DPO, IoTec), processing each payment notification exactly once so customers are never charged twice."
          - "Kept ticket counts consistent with real sales during demand spikes by enforcing limits with database constraints and guarded updates, preventing overselling."
      - company: "Harver"
        position: "Senior Full Stack Software Engineer"
        date:
        start_date: "2023-03"
        end_date: "2025-05"
        location: "New York, USA (remote)"
        summary: "Promoted to Senior in March 2023. Left in May 2025 to complete an MSc in Data Analytics full time."
        highlights:
          - "Owned delivery of three enterprise client products (candidate assessment matching, recruiter portals and analytics dashboards), working with product, analytics and client teams to turn business needs into data models and API contracts."
          - "Ran cross functional project planning, breaking product roadmaps into phased milestones and managing risks to hit scheduled release dates."
          - "Led investigation of high priority production incidents for enterprise clients, tracing issues across services with New Relic and Sentry to their root cause and shipping permanent fixes."
          - "Authored documentation for core data pipelines and services to speed up onboarding, and conducted 15+ technical interviews."
      - company: "Harver"
        position: "Full Stack Software Engineer"
        date:
        start_date: "2019-09"
        end_date: "2023-03"
        location: "New York, USA (remote)"
        summary:
        highlights:
          - "Designed and maintained **ETL pipelines** that ingested and transformed candidate assessment data, feeding client scoring models and workforce insight dashboards."
          - "Built talent mobility dashboards so enterprise clients could track career progression and skills across their organisations."
          - "Profiled slow API endpoints, removing N+1 database queries and adding caching on hot data paths to cut response times."
          - "Introduced structured logging and monitoring across services, replacing guesswork with a direct trail from each error to its cause."
    EDUCATION:
      - institution: "Birkbeck, University of London"
        area: "Data Analytics"
        degree: "MSc"
        date:
        start_date: "2024-10"
        end_date: "2025-09"
        location: "London, UK"
        summary: "Merit. Modules included Applied Machine Learning, Big Data Analytics, Data Analytics Using R, and Neural Networks & Deep Learning."
        highlights:
          - "Built and evaluated regression and classification models in Python (scikit-learn) and R, comparing them with cross validation."
          - "Dissertation on adversarial robustness: measured the tradeoff between accuracy and robustness for ResNet50 image classifiers on an ImageNet subset."
      - institution: "Makerere University"
        area: "Software Engineering"
        degree: "BSc"
        date:
        start_date: "2014-08"
        end_date: "2018-09"
        location: "Kampala, Uganda"
        summary:
        highlights:
          - "2:1 (Upper Second Class Honours)"
    MENTORSHIP:
      - name: "[CareerFoundry](https://careerfoundry.com/) (Online Coding Bootcamp)"
        date:
        start_date: "2023-03"
        end_date: "2026-01"
        location: "Berlin, Germany"
        summary: "Full Stack Web Development Mentor (Freelance)"
        highlights:
          - "Mentored 23+ students through the programme and held a 5/5 student rating for the quality and speed of my feedback."
