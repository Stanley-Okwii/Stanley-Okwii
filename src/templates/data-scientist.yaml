cv:
  name: "Stanley Okwii"
  location: "London, United Kingdom (UK Right to Work)"
  email: "stanlee.okwii@icloud.com"
  phone: "+44 7570 488 532"
  website: "https://stanleeokwii.info/"
  social_networks:
    - network: "LinkedIn"
      username: "stanley-okwii"
    - network: "GitHub"
      username: "Stanley-Okwii"
  sections:
    Summary:
      - "Software engineer building data and AI systems that run in production, in **Python** on **AWS**, from pipelines and database design through to the dashboards and applications people use. As founding engineer at Access to Energy, designed and built the retrieval pipeline, data model and document ingestion for a research assistant that answers questions with cited sources. Previously at Harver, took over the **Snowflake** and **dbt** pipeline behind the client analytics dashboards. MSc in Data Analytics (Merit) from Birkbeck, with a dissertation on adversarial robustness of image classifiers."
    skills:
      - label: "Programming"
        details: "**Python**, **TypeScript**, SQL, R"
      - label: "Data & ML"
        details: "**Snowflake**, **dbt**, **Pandas**, **NumPy**, **scikit-learn**, **TensorFlow**, adversarial robustness"
      - label: "AI & Retrieval"
        details: "RAG pipelines, hybrid retrieval, **pgvector**, embeddings, LLM integration (**Claude**, Gemini)"
      - label: "Backend"
        details: "**Django**, **Django REST Framework**, **FastAPI**, **Celery**, RabbitMQ, Redis Streams"
      - label: "Frontend"
        details: "**React**, **Next.js**, D3.js"
      - label: "Databases"
        details: "**PostgreSQL**, **Redis**, **MySQL**, MongoDB"
      - label: "Cloud & DevOps"
        details: "**AWS** (ECS Fargate, Bedrock, CloudFormation, Secrets Manager), **Docker**, **GitHub Actions**, CI/CD, Axiom, New Relic"
    experience:
      - company: "Access to Energy"
        position: "Founding Engineer"
        date:
        start_date: "2026-01"
        end_date: "present"
        location: "London, UK"
        summary: "An AI research assistant on energy access in Africa that cites a curated library of sector reports. Team of 4. Sole engineer for the first month, now owning the backend, AI pipeline and infrastructure."
        highlights:
          - "Built retrieval in **PostgreSQL** without a separate vector database: **pgvector** semantic search (HNSW) and keyword search, merged with reciprocal rank fusion. Keyword search catches specialist terms that semantic matching misses."
          - "Designed the data model: a shared curated library and organisation uploads in separate tables, hierarchical chunks linked to their parent, JSONB for metadata that varies by organisation, and feedback recorded against the chunks an answer drew on."
          - "Built document ingestion on **Redis Streams** with consumer groups, parallel workers and a dead-letter stream, so large PDFs are embedded without slowing the API."
          - "Made every answer cite the source passage it came from, because researchers need to know where information comes from. Quality is checked by hand. There is no automated evaluation yet."
          - "Isolated each organisation's data with **PostgreSQL** row-level security, and tracked token usage per organisation."
          - "Wrote the **CloudFormation** stacks for three containerised services on **ECS Fargate**, reducing environment setup from days to under fifteen minutes."
      - company: "Hoppers"
        position: "Full Stack Software Engineer (Contract, Part Time)"
        date:
        start_date: "2025-10"
        end_date: "present"
        location: "Remote"
        summary: "Event ticketing platform. Built the payment handling and the ticket reservation flow."
        highlights:
          - "Built payment handling for two providers (DPO, IoTec) with idempotent webhooks that use row-level locking to stop duplicate charges. Recorded settlements and booking fee snapshots for reconciliation."
          - "Stopped double booking by claiming a ticket with `select_for_update` in a short transaction, then holding it with a reserved status and expiry until payment succeeds or the hold lapses."
      - company: "Harver (formerly Pymetrics)"
        position: "Senior Full-Stack Software Engineer"
        date:
        start_date: "2023-03"
        end_date: "2025-05"
        location: "New York, USA (remote)"
        summary: "Promoted to Senior in March 2023. Stepped away in May 2025 to complete MSc in Data Analytics full time."
        highlights:
          - "Owned three client-facing products end to end: the candidate assessment platform (the games candidates take), the recruiter portal and client analytics dashboards."
          - "Took over the **Snowflake** and **dbt** pipeline behind the dashboards when the data scientist left. Stitch replicates production data into Snowflake and dbt builds staging and pre-aggregated analytics tables. I checked every change in my own Snowflake test schema."
          - "Agreed what counts as a completed assessment (12 of 16 games) with product and data science, applied it everywhere, and reconciled dashboard figures against the warehouse before each release."
          - "Found transformations being recomputed instead of reused and fixed them in dbt, which cut warehouse costs."
          - "Stripped personal data from assessment data before it reached Snowflake and New Relic, and worked on GDPR requirements: retention based deletion, candidate data export, and EU and US data residency."
          - "Led delivery for a team of five for about two months after our manager was let go with no handover, alongside a full workload. The team met every sprint commitment and shipped on time."
          - "Ran 15+ technical interviews against an existing rubric, and wrote onboarding documentation."
      - company: "Harver (formerly Pymetrics)"
        position: "Full-Stack Software Engineer"
        date:
        start_date: "2019-09"
        end_date: "2023-03"
        location: "New York, USA (remote)"
        summary:
        highlights:
          - "Built the assessment games candidates take, used by around 500,000 candidates a day, including accessibility accommodations (colour blindness, dyslexia font, extra time)."
          - "Built customer dashboards in **React** and **D3.js**, using **Pandas** and **NumPy** for the aggregations and statistics behind them."
          - "Fixed an N+1 query problem for a client with 120,000+ records. The endpoint went from 8 to 12 seconds to under 800ms and queries per page from 100+ to 3 to 5, with the record count cached for 30 minutes."
          - "Built candidate scoring on **Celery** queues with **RabbitMQ**, and a fan-out exchange to two services with idempotent consumers."
    Projects:
      - name: "Personal Projects"
        date:
        location:
        summary:
        highlights:
          - "**Cloudflare analytics reporting.** A **Python** script on **GitHub Actions** that pulls Web Analytics through GraphQL and emails a report."
          - "**Personal AI agent.** An agent on Oracle Cloud linked to WhatsApp and Discord that hands tasks to OpenCode."
          - "**Hosted decision model.** I host an open-weight model (Bespoke Nimble 9B, a LoRA adapter on Qwen3.5-9B, 4 bit quantised) on Modal as a **FastAPI** endpoint on a T4 GPU. I did not fine tune it."
    Mentorship:
      - name: "[CareerFoundry](https://careerfoundry.com/) (Online Coding Bootcamp)"
        date:
        start_date: "2023-03"
        end_date: "2026-01"
        location: "Berlin, Germany"
        summary: "Full Stack Web Development Mentor (Freelance)"
        highlights:
          - "Mentored 23+ students and held a 5/5 rating for the quality and speed of my feedback."
    education:
      - institution: "Birkbeck, University of London"
        area: "Data Analytics"
        degree: "MSc"
        date:
        start_date: "2024-10"
        end_date: "2025-09"
        location: "London, UK"
        summary:
        highlights:
          - "Merit. Dissertation: implemented PGD attacks from scratch, adversarially retrained ResNet50 (TensorFlow, ImageNet subset), and tested robustness against FGSM attacks."
          - "Coursework: scikit-learn classification, Pandas and NumPy for cleaning and statistics, and one module taught entirely in R."
      - institution: "Makerere University"
        area: "Software Engineering"
        degree: "BSc"
        date:
        start_date: "2014-08"
        end_date: "2018-09"
        location: "Kampala, Uganda"
        summary:
        highlights:
          - "2:1 (Upper Second Class Honours)"
design:
