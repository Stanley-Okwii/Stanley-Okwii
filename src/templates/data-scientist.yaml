cv:
  name: "Stanley Okwii"
  headline: "Data Analytics & Machine Learning  |  Python, SQL, Snowflake, dbt"
  location: "London, United Kingdom (UK Right to Work)"
  email: "stanlee.okwii@icloud.com"
  phone: "+44 7570 488 532"
  website: "https://stanleeokwii.info/"
  social_networks:
    - network: "LinkedIn"
      username: "stanley-okwii"
    - network: "GitHub"
      username: "Stanley-Okwii"
  sections:
    Summary:
      - "Data practitioner working in **Python** and **SQL**, from pipelines and warehouses through to the dashboards and models people use. As founding engineer at Access to Energy, designed the data model, search and document ingestion for a research assistant that answers questions with cited sources from a library of industry reports. Previously at Harver, took over the **Snowflake** and **dbt** warehouse behind client reporting, built the **Looker** dashboards customer success used to track each client's turnaround SLA, and traced reporting discrepancies back to their source in the pipeline. MSc in Data Analytics (Merit) from Birkbeck."
    skills:
      - label: "Programming"
        details: "**Python**, **SQL**, R, TypeScript"
      - label: "Data & ML"
        details: "**Pandas**, **NumPy**, **scikit-learn**, **TensorFlow**, regression, classification, cross validation, model evaluation, statistical analysis, adversarial robustness"
      - label: "Data Engineering"
        details: "**Snowflake**, **dbt** (models and tests), Stitch, data modelling, data validation and reconciliation, metric definition, GDPR data handling"
      - label: "AI & Retrieval"
        details: "RAG pipelines, hybrid retrieval, **pgvector**, embeddings, LLM integration (**Claude**, Gemini)"
      - label: "Visualisation"
        details: "**Looker**, Mode, client dashboards in **React** and **D3.js**"
      - label: "Databases"
        details: "**PostgreSQL**, **Redis**, **MySQL**, MongoDB"
      - label: "Engineering & Cloud"
        details: "**Django**, **FastAPI**, **Celery**, **AWS** (ECS Fargate, Bedrock, CloudFormation), **Docker**, **GitHub Actions**, New Relic, Axiom"
    experience:
      - company: "Access to Energy"
        position: "Founding Engineer"
        date:
        start_date: "2026-01"
        end_date: "present"
        location: "London, UK"
        summary: "Startup building an AI research assistant that answers questions on energy access in Africa from industry reports, citing its sources. Team of 4. Sole engineer for the first month, now owning the data model, AI pipeline and infrastructure."
        highlights:
          - "Designed the data model for a shared report library and each organisation's own uploads, linking user feedback to the passages behind each answer (**PostgreSQL**)."
          - "Built search that matches on both meaning and exact keywords, so specialist sector terms are not missed (**pgvector**)."
          - "Made every answer cite its source passage, so researchers can verify any figure. Quality is reviewed by hand, with no automated evaluation yet."
          - "Built background indexing for large PDF reports that retries failed documents instead of losing them (**Redis Streams**)."
          - "Kept each organisation's data private at the database level, and automated cloud setup from days to minutes (**AWS**, CloudFormation)."
      - company: "Hoppers"
        position: "Full Stack Software Engineer (Contract, Part Time)"
        date:
        start_date: "2025-10"
        end_date: "present"
        location: "Remote"
        summary: "Event ticketing platform taking online payments."
        highlights:
          - "Built payment handling for two providers (DPO, IoTec) so each payment notification is processed exactly once, and recorded settlements and booking fee snapshots for reconciliation."
      - company: "Harver (formerly Pymetrics)"
        position: "Senior Full Stack Software Engineer"
        date:
        start_date: "2023-03"
        end_date: "2025-05"
        location: "New York, USA (remote)"
        summary: "Hiring assessment software used by large employers to screen job candidates. Promoted to Senior in March 2023. Stepped away in May 2025 to complete MSc in Data Analytics full time."
        highlights:
          - "Owned three client products end to end: the online assessment candidates take, the portal recruiters use to review them, and the analytics dashboards clients use to track their hiring."
          - "Took over the analytics warehouse (**Snowflake**, **dbt**) when the data scientist left, keeping client reporting running and testing every change in my own schema before release."
          - "Built the reporting customer success used to check whether each client was getting candidate results within its agreed turnaround (SLA), leaving out rare stuck cases so they did not distort the picture."
          - "Built completion funnels showing clients how many invited candidates registered, finished and passed: first as **SQL** queries in Mode, then as **Looker** dashboards after the migration."
          - "Investigated why dashboard figures disagreed with the recruiter portal, traced the gap to where records were being duplicated in the pipeline, and fixed it. Removed test accounts from client reports so clients saw only real activity."
          - "Agreed one definition of a completed assessment with product and data science, then guarded the numbers with automated data checks in dbt and reconciliation against the warehouse before each release."
          - "Found calculations being repeated instead of reused and restructured them, which cut warehouse costs and sped up slow reports."
          - "Kept personal data out of the warehouse and monitoring tools, and delivered GDPR requirements: deletion after retention periods, candidate data export, and EU and US data kept in their own regions."
          - "Led a team of five for about two months after our manager left, alongside a full workload; every sprint commitment was met. Ran 15+ technical interviews."
      - company: "Harver (formerly Pymetrics)"
        position: "Full Stack Software Engineer"
        date:
        start_date: "2019-09"
        end_date: "2023-03"
        location: "New York, USA (remote)"
        summary:
        highlights:
          - "Built the online assessments candidates take, used by around 500,000 candidates a day, with accessibility options for colour blindness, dyslexia and extra time."
          - "Built client analytics dashboards in **React** and **D3.js**, with **Pandas** and **NumPy** for the aggregations and statistics behind them."
          - "Made a slow page for a large client (120,000+ records) load in under a second instead of 8 to 12 seconds, by cutting more than 100 repeated database queries per page down to 3 to 5."
    education:
      - institution: "Birkbeck, University of London"
        area: "Data Analytics"
        degree: "MSc"
        date:
        start_date: "2024-10"
        end_date: "2025-09"
        location: "London, UK"
        summary: "Merit. Modules included Applied Machine Learning, Big Data Analytics, Data Analytics Using R, and Neural Networks and Deep Learning."
        highlights:
          - "Built and evaluated regression and classification models in **Python** (scikit-learn) and **R**, comparing them with cross validation. Used Pandas and NumPy for cleaning and statistics."
          - "Dissertation on adversarial robustness: implemented PGD attacks from scratch, adversarially retrained ResNet50 (**TensorFlow**, ImageNet subset), and measured the tradeoff between accuracy and robustness against FGSM attacks."
      - institution: "Makerere University"
        area: "Software Engineering"
        degree: "BSc"
        date:
        start_date: "2014-08"
        end_date: "2018-09"
        location: "Kampala, Uganda"
        summary:
        highlights:
          - "2:1 (Upper Second Class Honours)"
    Projects:
      - name: "Personal Projects"
        date:
        location:
        summary:
        highlights:
          - "**Cloudflare analytics reporting.** A **Python** script on **GitHub Actions** that pulls Web Analytics through GraphQL and emails a report."
    Mentorship:
      - name: "[CareerFoundry](https://careerfoundry.com/) (Online Coding Bootcamp)"
        date:
        start_date: "2023-03"
        end_date: "2026-01"
        location: "Berlin, Germany"
        summary: "Full Stack Web Development Mentor (Freelance)"
        highlights:
          - "Mentored 23+ students and held a 5/5 rating for the quality and speed of my feedback."
design:
  theme: "engineeringclassic"
  page:
    size: "a4"
    top_margin: "1.5cm"
    bottom_margin: "1.5cm"
    left_margin: "1.5cm"
    right_margin: "1.5cm"
    show_footer: false
    show_top_note: false
  colors:
    body: "rgb(0, 0, 0)"
    name: "rgb(0, 79, 144)"
    connections: "rgb(0, 79, 144)"
    section_titles: "rgb(0, 79, 144)"
    links: "rgb(0, 79, 144)"
    footer: "rgb(128, 128, 128)"
    top_note: "rgb(128, 128, 128)"
  typography:
    font_family:
      body: "Raleway"
      name: "Raleway"
      headline: "Raleway"
      connections: "Raleway"
      section_titles: "Raleway"
    font_size:
      body: "10pt"
      name: "30pt"
      section_titles: "1.4em"
    line_spacing: "0.6em"
    alignment: "left"
    date_and_location_column_alignment: "right"
    bold:
      name: false
      section_titles: false
    small_caps:
      name: false
  links:
    underline: false
    show_external_link_icon: false
  header:
    alignment: "left"
    photo_width: "3.5cm"
    space_below_name: "0.3cm"
    space_below_connections: "0.4cm"
    connections:
      phone_number_format: "international"
      hyperlink: true
      show_icons: true
      display_urls_instead_of_usernames: false
      separator: ""
      space_between_connections: "0.5cm"
  section_titles:
    type: "with_partial_line"
    line_thickness: "0.5pt"
    space_above: "0.4cm"
    space_below: "0.25cm"
  sections:
    allow_page_break: true
    space_between_regular_entries: "0.9em"
    show_time_spans_in: []
  entries:
    date_and_location_width: "4.15cm"
    side_space: "0.2cm"
    space_between_columns: "0.1cm"
    allow_page_break: true
    short_second_row: false
    highlights:
      bullet: "•"
      nested_bullet: "-"
      space_above: "0.2cm"
      space_left: "0cm"
      space_between_items: "0.15cm"
      space_between_bullet_and_text: "0.5em"
  templates:
    footer: "NAME - Page PAGE_NUMBER of TOTAL_PAGES"
    top_note: "*LAST_UPDATED CURRENT_DATE*"
    single_date: "MONTH_ABBREVIATION YEAR"
    date_range: "START_DATE – END_DATE"
    one_line_entry:
      main_column: "**LABEL:** DETAILS"
    education_entry:
      main_column: "**INSTITUTION**, AREA -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      degree_column: "**DEGREE**"
      date_and_location_column: "DATE"
    normal_entry:
      main_column: "**NAME** -- **LOCATION**\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "DATE"
    experience_entry:
      main_column: "**POSITION**, COMPANY -- LOCATION\nSUMMARY\nHIGHLIGHTS"
      date_and_location_column: "DATE"
    publication_entry:
      main_column: "**TITLE**\nAUTHORS\nURL (JOURNAL)"
      date_and_location_column: "DATE"
