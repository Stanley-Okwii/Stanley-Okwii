          - "Built the payment system across multiple providers, with commission tracking and booking-fee snapshots for revenue reconciliation."
          - "Implemented QR-code ticketing with server-side validation, per-user purchase limits, and concurrency safeguards against double-booking under load."
          - "Shipped team management — invitations, permissions, organiser dashboards — as primary contributor across backend, admin, and mobile."
