settings:
  # "today" resolves to the real current date, so this never goes stale.
  current_date: "today"
  # Leave empty. RenderCV 2.8 (the latest release) applies bold_keywords twice to
  # entry content, so every keyword renders with visible square brackets, e.g.
  # "[Python]". Use explicit **bold** markers in the text above instead.
  # See https://github.com/rendercv/rendercv/issues/706
  bold_keywords: []
  render_command:
    # Output flags are owned by the Makefile (FLAGS), which CI also calls.
    pdf_path: ../resumes/Stanley_Okwii_CV.pdf
