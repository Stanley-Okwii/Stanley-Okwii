cv:
  name: "Stanley Okwii"
  location: "London, United Kingdom (UK Right to Work)"
  email: "stanlee.okwii@icloud.com"
  phone: "+44 7570 488 532"
  website: "https://stanleeokwii.info/"
  social_networks:
    - network: "LinkedIn"
      username: "stanley-okwii"
    - network: "GitHub"
      username: "Stanley-Okwii"
  sections:
    Summary:
      - "Senior software engineer with 6+ years building production systems in Python and TypeScript on AWS, across payments, analytics products and data pipelines. Currently founding engineer on an AI research assistant, owning the hybrid retrieval pipeline, agent orchestration, and multi-tenant cloud infrastructure. Experienced across the full lifecycle—from schema design and IaC to React interfaces—leveraging agentic development harnesses for rapid delivery while maintaining strict ownership of architecture, security, and system reliability."
    skills:
      - label: "Programming"
        details: "Python, TypeScript, JavaScript, SQL, Dart"
      - label: "AI/ML"
        details: "RAG pipelines, LLM integration (Claude and Gemini APIs), prompt engineering, agent and tool use workflows, embeddings, vector search (pgvector), hybrid retrieval"
      - label: "Backend and Frameworks"
        details: "Django, FastAPI, Flask, Node.js, Express, GraphQL, Celery, Redis"
      - label: "Frontend and Mobile"
        details: "React, Next.js, Flutter"
      - label: "Databases"
        details: "PostgreSQL, MongoDB, Redis, MySQL"
      - label: "Infrastructure"
        details: "AWS (ECS, Bedrock, CloudFormation), GCP, Docker, GitHub Actions, Supabase, Sentry, New Relic, Terraform, Kubernetes"
      - label: "Testing"
        details: "Jest, Playwright, Pytest"
      - label: "Developer Tooling"
        details: "Claude Code (custom skills and agent workflows), Dev Containers, CI/CD"
    experience:
      - company: "Access to Energy"
        position: "Founding Engineer"
        date:
        start_date: "2026-01"
        end_date: "present"
        location: "London, UK"
        summary: "An AI research assistant that answers questions on energy access in Africa, citing evidence from a curated library of sector reports. Team of 4. I own the backend, the AI pipeline and the infrastructure."
        highlights:
          - "Built the core hybrid search engine combining keyword matching (BM25) and semantic vector search (768-dim Gemini embeddings, HNSW) in PostgreSQL, delivering accurate passage retrieval without external database overhead."
          - "Built the end-to-end RAG assistant in Python (bespoke pipeline without LangChain bloat), routing questions to AWS Bedrock (Claude 3 Haiku) with streaming inline citations and automated Gemini fallback."
          - "Built the background document ingestion pipeline using a custom Redis Streams worker (consumer groups, dead-letter retries) to parse, chunk, and embed large PDFs without degrading API response times."
          - "Designed multi-tenant data isolation and access controls in PostgreSQL, letting multiple client organisations share one deployment while keeping their documents fully partitioned and metering usage."
          - "Automated AWS infrastructure provisioning using modular nested CloudFormation stacks, deploying ECS Fargate microservices, ElastiCache Redis 7.1, ALB, and Fluent Bit telemetry to Axiom."
      - company: "Hoppers"
        position: "Full Stack Software Engineer (Contract, Part Time)"
        date:
        start_date: "2025-10"
        end_date: "present"
        location: "Remote"
        summary: "Event ticketing platform (hoppers.ug). Built the multi-provider payment engine and high-concurrency reservation system."
        highlights:
          - "Built the multi-provider payment system (DPO, IoTec), implementing idempotent webhook handling via row-level locking (SELECT FOR UPDATE) to eliminate duplicate charges."
          - "Prevented ticket overselling during demand spikes by building a high-concurrency reservation engine with guarded atomic updates (Django F expressions) and database check constraints."
          - "Enforced purchase limits and venue table reservations by serializing booking state transitions with row-level locks, stopping race conditions during high-traffic checkout."
          - "Delivered core platform features end-to-end across the Django backend, React admin panel, and mobile app, covering QR code ticket verification and role-based permissions."
          - "Created an automated testing harness using Claude Code agents to turn GitHub issues into draft pull requests verified by Playwright UI diffs and replayed API test suites."
      - company: "Harver"
        position: "Senior Full Stack Software Engineer"
        date:
        start_date: "2023-03"
        end_date: "2025-05"
        location: "New York, USA (remote)"
        summary: "Promoted to Senior in March 2023. Stepped away in May 2025 to complete MSc in Data Analytics full time."
        highlights:
          - "Owned the architecture and delivery of three enterprise client products—candidate assessment matching, recruiter portal, and analytics dashboards—built with Django REST Framework, PostgreSQL, and React."
          - "Led technical design and RFCs across engineering, product, and design, building asynchronous task queues with Celery and RabbitMQ to process candidate scoring pipelines."
          - "Directed Tier-3 incident response for enterprise clients, isolating distributed regressions via New Relic APM and Sentry traces to deliver permanent root-cause fixes."
          - "Ran cross-functional project planning, breaking complex product roadmaps into phased milestones and managing risk mitigation to hit scheduled release dates."
          - "Conducted 15+ technical interviews for system design and code quality, and authored onboarding documentation for core services to accelerate new hire ramp-up."
      - company: "Harver"
        position: "Full Stack Software Engineer"
        date:
        start_date: "2019-09"
        end_date: "2023-03"
        location: "New York, USA (remote)"
        summary:
        highlights:
          - "Introduced structured logging and APM monitoring across distributed Django services with Sentry and New Relic, replacing speculative debugging with direct error-to-cause tracing."
          - "Built talent mobility dashboards in React, enabling enterprise clients to track employee career progression and skills across their organizations."
          - "Profiled high-latency API endpoints, eliminating N+1 database queries and implementing Memcached caching on hot data paths."
          - "Automated deployment pipelines with GitHub Actions and Docker, replacing manual deployment procedures with one-click CI/CD releases."
    Mentorship:
      - name: "[CareerFoundry](https://careerfoundry.com/) (Online Coding Bootcamp)"
        date:
        start_date: "2023-03"
        end_date: "2026-01"
        location: "Berlin, Germany"
        summary: "Full Stack Web Development Mentor (Freelance)"
        highlights:
          - "Mentored 23+ students through the Full Stack Web Development program and held a 5/5 student rating for the quality and speed of my feedback."
    education:
      - institution: "Birkbeck, University of London"
        area: "Data Analytics"
        degree: "MSc"
        date:
        start_date: "2024-10"
        end_date: "2025-09"
        location: "London, UK"
        summary:
        highlights:
          - "Merit. Dissertation on adversarial robustness in image classification: implemented PGD attacks from scratch and adversarially retrained ResNet50 on an ImageNet subset."
      - institution: "Makerere University"
        area: "Software Engineering"
        degree: "BSc"
        date:
        start_date: "2014-08"
        end_date: "2018-09"
        location: "Kampala, Uganda"
        summary:
        highlights:
          - "2:1 (Upper Second Class Honours)"
