  sections:
    Summary:
      - "Senior engineer with 6+ years shipping production systems in Python and TypeScript on AWS, spanning payment platforms, analytics products, and data pipelines. Currently building an LLM research assistant end-to-end as a founding engineer: retrieval, evaluation, and multi-tenant infrastructure. AI-assisted development is part of my normal workflow, from coding to review and testing."
    skills:
      - label: "Programming"
        details: "Python, TypeScript, JavaScript, SQL, Dart"
      - label: "AI/ML"
        details: "RAG pipelines, LLM integration (Claude and Gemini APIs), LLM evaluation, prompt engineering, agent and tool-use workflows, vector search (pgvector), embeddings, hybrid retrieval"
      - label: "Backend and Frameworks"
        details: "Django, FastAPI, Flask, Node.js, Express, GraphQL, Celery, Redis"
      - label: "Frontend and Mobile"
        details: "React, Next.js, Flutter"
      - label: "Databases"
        details: "PostgreSQL, MongoDB, Redis, MySQL"
      - label: "Infrastructure"
