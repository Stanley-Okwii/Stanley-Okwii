cv:
  name: "Stanley Okwii"
  location: "London, United Kingdom (UK Right to Work)"
  email: "stanlee.okwii@icloud.com"
  phone: "+44 7570 488 532"
  website: "https://stanleeokwii.info/"
  social_networks:
    - network: "LinkedIn"
      username: "stanley-okwii"
    - network: "GitHub"
      username: "Stanley-Okwii"
  sections:
    Summary:
      - "Full-stack engineer working in **Python** and **TypeScript** on **AWS**, from database and infrastructure design through to the applications people use. As founding engineer at Access to Energy, designed and built the backend, AI pipeline and AWS infrastructure for a research assistant that answers questions with cited sources from a curated library of sector reports. Previously at Harver, promoted to senior engineer, owned three client products end to end, worked on assessment games with around 500,000 daily users, led a team of five for two months after our manager left, and ran 15+ technical interviews."
    skills:
      - label: "Programming"
        details: "**Python**, **TypeScript**, JavaScript, SQL"
      - label: "AI & ML"
        details: "RAG pipelines, hybrid retrieval, **pgvector**, embeddings, LLM integration (**Claude**, Gemini), prompt engineering"
      - label: "Backend"
        details: "**Django**, **Django REST Framework**, **FastAPI**, **Node.js**, **Celery**, RabbitMQ, Redis Streams, Supabase (auth and Postgres)"
      - label: "Frontend & Mobile"
        details: "**React**, **Next.js**, **Flutter**, D3.js"
      - label: "Databases"
        details: "**PostgreSQL**, **Redis**, **MySQL**, MongoDB, Snowflake, dbt"
      - label: "Cloud & DevOps"
        details: "**AWS** (ECS Fargate, Bedrock, CloudFormation, Secrets Manager), **Docker**, **GitHub Actions**, CI/CD, Axiom, Sentry, New Relic"
      - label: "Testing"
        details: "**Pytest**, **Playwright**, Jest, React Testing Library"
      - label: "Developer Tooling"
        details: "Claude Code (custom skills & agent workflows), Dev Containers"
    experience:
      - company: "Access to Energy"
        position: "Founding Engineer"
        date:
        start_date: "2026-01"
        end_date: "present"
        location: "London, UK"
        summary: "An AI research assistant on energy access in Africa that cites a curated library of sector reports. Team of 4. Sole engineer for the first month, now owning the backend, AI pipeline and infrastructure."
        highlights:
          - "Built retrieval in **PostgreSQL** without a separate vector database: **pgvector** semantic search (HNSW) and keyword search, merged with reciprocal rank fusion. Keyword search catches specialist terms that semantic matching misses."
          - "Built the answering service in **Python** (**FastAPI**) without LangChain or similar. It calls **Claude** through **AWS Bedrock**, streams inline citations, and declines questions the library cannot support."
          - "Built document ingestion on **Redis Streams** with consumer groups, parallel workers and a dead-letter stream, so large PDFs are embedded without slowing the API."
          - "Isolated each organisation's data with **PostgreSQL** row-level security, and tracked token usage per organisation."
          - "Wrote the **CloudFormation** stacks for three containerised services (chat API, query service, ingestion service) on **ECS Fargate**, reducing environment setup from days to under fifteen minutes. Three junior engineers set the project up alone after one onboarding call."
          - "Built a pull request review agent used by the Access to Energy and Hoppers teams. It combines two models' reviews, posts first-pass feedback, and flags me only when they disagree. A human still approves every merge."
      - company: "Hoppers"
        position: "Full Stack Software Engineer (Contract, Part Time)"
        date:
        start_date: "2025-10"
        end_date: "present"
        location: "Remote"
        summary: "Event ticketing platform. Built the payment handling and the ticket reservation flow."
        highlights:
          - "Built payment handling for two providers (DPO, IoTec) with idempotent webhooks that use row-level locking to stop duplicate charges. Recorded settlements and booking fee snapshots for reconciliation."
          - "Stopped double booking by claiming a ticket with `select_for_update` in a short transaction, then holding it with a reserved status and expiry until payment succeeds or the hold lapses. Purchase limits are enforced in the same flow."
          - "Delivered features across the **Django** backend, **React** admin panel and **Flutter** app, including QR ticketing with server-side validation and team permissions. Errors are tracked in **Sentry**."
      - company: "Harver (formerly Pymetrics)"
        position: "Senior Full-Stack Software Engineer"
        date:
        start_date: "2023-03"
        end_date: "2025-05"
        location: "New York, USA (remote)"
        summary: "Promoted to Senior in March 2023. Stepped away in May 2025 to complete MSc in Data Analytics full time."
        highlights:
          - "Owned three client-facing products end to end: the candidate assessment platform (the games candidates take), the recruiter portal and client analytics dashboards, built in **Django**, **PostgreSQL** and **React**."
          - "Led delivery for a team of five for about two months after our manager was let go with no handover, alongside a full workload. The team met every sprint commitment and shipped on time."
          - "Pushed back on deprecating a database table in one sprint. I specced where it was still used (production writing, the warehouse reading) and proposed a staged plan, preventing a production break."
          - "Built candidate scoring on **Celery** queues with **RabbitMQ**, and a fan-out exchange to two services with idempotent consumers."
          - "Took over the **Snowflake** and **dbt** pipeline behind the dashboards when the data scientist left, and agreed what counts as a completed assessment (12 of 16 games) with product and data science."
          - "Treated a broken assessment game as severity one because it stalled a candidate's job application: fixed and shipped straight away, monitored with **New Relic**. Took turns on a two week investigation rotation, including data migrations made safe with backups, undo scripts and staging runs."
          - "Ran 15+ technical interviews against an existing rubric, and wrote onboarding documentation for systems where I had become the bottleneck."
      - company: "Harver (formerly Pymetrics)"
        position: "Full-Stack Software Engineer"
        date:
        start_date: "2019-09"
        end_date: "2023-03"
        location: "New York, USA (remote)"
        summary:
        highlights:
          - "Built the assessment games candidates take, used by around 500,000 candidates a day, including accessibility accommodations (colour blindness, dyslexia font, extra time)."
          - "Fixed an N+1 query problem for a client with 120,000+ records. The endpoint went from 8 to 12 seconds to under 800ms and queries per page from 100+ to 3 to 5, with the record count cached for 30 minutes."
          - "Automated the micro-frontend deploy on push (**GitHub Actions**, S3, CloudFront). Manual work fell from about twenty minutes to under five, and deployment errors from about five a quarter to none."
          - "Moved **New Relic** logs from plain strings to searchable key-value fields."
    Mentorship:
      - name: "[CareerFoundry](https://careerfoundry.com/) (Online Coding Bootcamp)"
        date:
        start_date: "2023-03"
        end_date: "2026-01"
        location: "Berlin, Germany"
        summary: "Full Stack Web Development Mentor (Freelance)"
        highlights:
          - "Mentored 23+ students and held a 5/5 rating for the quality and speed of my feedback."
    education:
      - institution: "Birkbeck, University of London"
        area: "Data Analytics"
        degree: "MSc"
        date:
        start_date: "2024-10"
        end_date: "2025-09"
        location: "London, UK"
        summary:
        highlights:
          - "Merit. Dissertation: implemented PGD attacks from scratch, adversarially retrained ResNet50 (TensorFlow, ImageNet subset), and tested robustness against FGSM attacks."
      - institution: "Makerere University"
        area: "Software Engineering"
        degree: "BSc"
        date:
        start_date: "2014-08"
        end_date: "2018-09"
        location: "Kampala, Uganda"
        summary:
        highlights:
          - "2:1 (Upper Second Class Honours)"
